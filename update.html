<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <meta name="referrer" content="no-referrer" />
    <title>Woodline · обновление доски</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; min-height: 100svh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; color: #20332a; background: #f4f5ef; }
      main { width: 100%; max-width: 540px; padding: clamp(24px, 5vw, 40px); background: #fffefa; border: 1px solid #dbe4d5; border-radius: 24px; }
      small { color: #336649; letter-spacing: .16em; font-weight: 700; }
      h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.2; margin: 16px 0; }
      p { margin: 16px 0; }
      button { padding: 14px 20px; border: 0; border-radius: 12px; background: #265b40; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { cursor: progress; opacity: .7; }
      button:focus-visible, a:focus-visible { outline: 3px solid #a1c29a; outline-offset: 4px; }
      a { color: #265b40; }
      #status { color: #526356; }
    </style>
  </head>
  <body>
    <main>
      <small>WOODLINE</small>
      <h1>Свежая версия доски</h1>
      <p>Обновим приложение. Задачи, показатели, вход в аккаунт и очередь сохранения останутся в браузере.</p>
      <p>Перед обновлением закройте формы редактирования и дождитесь сохранения изменений в облаке.</p>
      <button id="refresh" type="button">Обновить и открыть доску</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a href="./">Вернуться к доске</a>
      <noscript><p>Для обновления включите JavaScript.</p></noscript>
    </main>
    <script>
      "use strict";
      const button = document.getElementById("refresh");
      const status = document.getElementById("status");
      async function refresh() {
        button.disabled = true;
        status.textContent = "Проверяем сеть и открываем новую версию…";
        try {
          // This standalone file is deliberately outside the worker's shell
          // allowlist, so it remains reachable when the main page is stale.
          const probe = await fetch(new URL("update.html?check=" + Date.now(), location.href), {
            method: "HEAD", cache: "no-store", credentials: "same-origin"
          });
          if (!probe.ok) throw Error("Сервер обновления пока недоступен.");
          if ("serviceWorker" in navigator) {
            const scope = new URL("./", location.href).href;
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              // Do not touch other Pages apps on this origin, nor data caches.
              if (registration.scope === scope && !(await registration.unregister())) {
                throw Error("Не удалось завершить обновление. Повторите попытку.");
              }
            }
          }
          // Keep all localStorage, IndexedDB and caches intact. Unregistering
          // changes only which shell handles the next navigation.
          const target = new URL("./", location.href);
          target.searchParams.set("updated", Date.now());
          location.replace(target.href);
        } catch (error) {
          status.textContent = "Обновление не завершено. " + error.message + " Данные не удалены; проверьте интернет и попробуйте снова.";
          button.disabled = false;
        }
      }
      button.addEventListener("click", refresh);
    </script>
  </body>
</html>
